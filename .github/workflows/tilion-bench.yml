name: tilion browser bench

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Iterations"
        default: "100"
        required: false

jobs:
  bench:
    runs-on: namespace-profile-tilion-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run bench -- --mode browser --provider tilion --iterations ${{ github.event.inputs.iterations || '100' }}
        env:
          TILION_API_KEY: ${{ secrets.TILION_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: results/browser/
